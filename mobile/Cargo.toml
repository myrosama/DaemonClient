[workspace]
resolver = "3"
members = ["core/dc-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# Hostile input must never crash the app (docs/plan/GATES.md, Gate 3).
cast_possible_truncation = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
