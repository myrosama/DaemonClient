[package]
name = "dc-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aes-gcm = { version = "=0.11.1", features = ["zeroize"] }
base64 = "=0.23.1"
bytes = "=1.12.1"
getrandom = "=0.4.3"
log = "=0.4.34"
pbkdf2 = { version = "=0.13.0", default-features = false, features = ["hmac"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha2 = "=0.11.1"
subtle = "=2.6.1"
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros"] }
webpki-roots = "=1.0.11"
zeroize = "=1.9.1"

[dev-dependencies]
hex = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tempfile = "=3.27.0"
wiremock = "=0.6.5"
