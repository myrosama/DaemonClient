name: DCPhotos
options:
  bundleIdPrefix: uz.daemonclient
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # The core is built for arm64 only (device and Apple-silicon Simulator).
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    MARKETING_VERSION: "1.0.29"
    CURRENT_PROJECT_VERSION: "30"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  DCPhotos:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Resources
        buildPhase: resources
      # The core's Swift bindings, generated with the library by core/dc-ffi/build-ios.sh (never copied here).
      - path: ../../core/dc-ffi/build/swift/dc_ffi.swift
    dependencies:
      - framework: ../../core/dc-ffi/build/DCCore.xcframework
        embed: false
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Phosphor Photos
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # iPad: all four orientations (Split View / Stage Manager need it)
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [uz.daemonclient.photos.backup, uz.daemonclient.photos.refresh]
        NSPhotoLibraryUsageDescription: "To back up your photos and videos to your Phosphor storage."
        NSPhotoLibraryAddUsageDescription: "To save photos and videos from your Phosphor storage to this iPhone."
        NSFaceIDUsageDescription: "So that only you can open Hidden and Recently Deleted."
        NSLocalNetworkUsageDescription: "To reach a Phosphor server on your local network."
        # Loopback (the core's local media server) and self-hosted servers at home.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.daemonclient.photos
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [DCPhotosTests, DCPhotosUITests]
  # Unit tests of the app's own logic (run on the Simulator, hosted in the app).
  DCPhotosTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: DCPhotos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.daemonclient.photos.tests
        GENERATE_INFOPLIST_FILE: YES
  # I4 Gate 2 on the Simulator: sign-in, restore and sign-out through the core (UITests/SignInTests.swift).
  DCPhotosUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: DCPhotos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.daemonclient.photos.uitests
        GENERATE_INFOPLIST_FILE: YES
