experimental_monorepo_root = true

[monorepo]
config_roots = ["web"]

[tools]
node = "24.15.0"
pnpm = "10.33.0"

[settings]
experimental = true
pin = true

# SDK tasks
[tasks."sdk:install"]
dir = "open-api/typescript-sdk"
run = "pnpm install --filter @immich/sdk --frozen-lockfile"

[tasks."sdk:build"]
dir = "open-api/typescript-sdk"
run = "pnpm run build"

# i18n tasks
[tasks."i18n:format"]
dir = "i18n"
run = "pnpm run format"

[tasks."i18n:format-fix"]
dir = "i18n"
run = "pnpm run format:fix"
