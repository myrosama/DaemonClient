allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(':app')
    // home_widget's android module declares androidx.glance:+ (dynamic), which
    // now resolves to 1.3.0-alpha01 demanding compileSdk 37 / AGP 9.1 and
    // breaks the build. Force the version our catalog pins.
    // Its androidx.work:work-runtime-ktx:2.+ likewise resolves to 2.12.0, built
    // for JVM 11, whose inline OneTimeWorkRequestBuilder cannot be inlined into
    // home_widget's JVM 1.8 code. 2.11.2 is still a JVM 1.8 build (class-file
    // major 52, checked 2026-10-27) and the newest 2.11 fix release;
    // background_downloader asks for 2.11.0. This also lifts the app's own
    // catalog pin (libs.versions.toml `work = "2.9.1"`).
    project.configurations.configureEach {
        resolutionStrategy {
            force 'androidx.glance:glance-appwidget:1.1.1'
            force 'androidx.glance:glance:1.1.1'
            force 'androidx.work:work-runtime:2.11.2'
            force 'androidx.work:work-runtime-ktx:2.11.2'
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

tasks.named('wrapper') {
    distributionType = Wrapper.DistributionType.ALL
}
