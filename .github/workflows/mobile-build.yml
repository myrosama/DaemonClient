# DaemonClient mobile (fork of immich/mobile) — CI builds without owning a Mac.
# Android: installable debug APK artifact.
# iOS: UNSIGNED simulator .app (no Apple account needed) — runs on Appetize.io
#      in the browser and in CI simulators.
# Triggers only on mobile changes (or manually) so worker/web pushes never
# burn minutes. Since P0 task 0.4 the app links the Rust core
# (mobile/packages/dc_core_flutter), so both jobs install Rust and the core's
# changes trigger them too.
name: mobile-build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'immich/mobile/**'
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'

# Nothing here writes to the repository.
permissions:
  contents: read

defaults:
  run:
    working-directory: immich/mobile

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The core is compiled during the app build by cargokit, which runs
      # `rustup run stable` and ignores mobile/rust-toolchain.toml — so fail
      # loudly if `stable` is not the pinned version (P0 task 0.5).
      - name: Rust for the core
        working-directory: mobile
        run: |
          rustup show
          rustup toolchain install stable --profile minimal
          pinned=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          stable=$(rustup run stable rustc --version | cut -d' ' -f2)
          echo "pinned $pinned, stable $stable"
          test "$pinned" = "$stable" || { echo "Bump mobile/rust-toolchain.toml to $stable (and re-run the core's tests): cargokit builds the apps with stable."; exit 1; }
      # Third-party actions are pinned to a commit: a moved tag must not change what runs.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.7'
          channel: stable
          cache: true
      - run: flutter pub get
      # lib/generated/* (translations) is gitignored codegen output — main.dart
      # imports it, so generate before building (mirrors `make translation`,
      # minus the pnpm format step).
      - name: Generate translations
        run: |
          dart run easy_localization:generate -S ../i18n
          dart run bin/generate_keys.dart
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: daemonclient-android-apk
          path: immich/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Default runner Xcode SDK is too old for device_info_plus
      # (NSProcessInfo.isiOSAppOnVision) — pick the newest stable.
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      # The core is compiled during the app build by cargokit, which runs
      # `rustup run stable` and ignores mobile/rust-toolchain.toml — so fail
      # loudly if `stable` is not the pinned version (P0 task 0.5).
      - name: Rust for the core
        working-directory: mobile
        run: |
          rustup show
          rustup toolchain install stable --profile minimal
          pinned=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          stable=$(rustup run stable rustc --version | cut -d' ' -f2)
          echo "pinned $pinned, stable $stable"
          test "$pinned" = "$stable" || { echo "Bump mobile/rust-toolchain.toml to $stable (and re-run the core's tests): cargokit builds the apps with stable."; exit 1; }
      # Third-party actions are pinned to a commit: a moved tag must not change what runs.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.7'
          channel: stable
          cache: true
      # Flutter's simulator builds pass `-sdk iphonesimulator`, which builds
      # Swift macro programs for the Simulator; upstream Immich's patch removes
      # it (RESEARCH §7). subosito sets FLUTTER_ROOT, which the script reads.
      - name: Patch Flutter for Swift macros
        run: bash ios/scripts/xcode_flutter_patch.sh
      - run: flutter pub get
      # lib/generated/* (translations) is gitignored codegen output — main.dart
      # imports it, so generate before building (mirrors `make translation`,
      # minus the pnpm format step).
      - name: Generate translations
        run: |
          dart run easy_localization:generate -S ../i18n
          dart run bin/generate_keys.dart
      - run: flutter build ios --simulator
      - name: Zip simulator app (Appetize-ready)
        run: |
          cd build/ios/iphonesimulator
          zip -qr daemonclient-ios-simulator.zip *.app
      - uses: actions/upload-artifact@v4
        with:
          name: daemonclient-ios-simulator
          path: immich/mobile/build/ios/iphonesimulator/daemonclient-ios-simulator.zip
          retention-days: 14
