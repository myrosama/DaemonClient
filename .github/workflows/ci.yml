# Continuous integration for the JS/TS parts of DaemonClient.
#
# The mobile app (Flutter) has its own workflow (mobile-build.yml). Each job
# here is path-filtered so a push that only touches, say, the worker never
# spends minutes rebuilding the web apps. Every job runs the exact commands
# that pass locally, so a red run means a real regression, not CI drift.
name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch/PR supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Refuse credential-shaped content on every push and PR. The local pre-commit
  # hook is opt-in and `--no-verify` skips it; this is the backstop. Not
  # path-filtered on purpose: a secret can land in any file.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/scan-secrets.mjs --all

  # Which areas changed — every downstream job gates on these so unrelated
  # pushes stay free.
  changes:
    runs-on: ubuntu-latest
    outputs:
      shim: ${{ steps.filter.outputs.shim }}
      deployment: ${{ steps.filter.outputs.deployment }}
      processor: ${{ steps.filter.outputs.processor }}
      accounts: ${{ steps.filter.outputs.accounts }}
      drive: ${{ steps.filter.outputs.drive }}
      selfhost: ${{ steps.filter.outputs.selfhost }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shim:
              - 'immich-api-shim/**'
              - '.github/workflows/ci.yml'
            deployment:
              - 'deployment-service/**'
              - 'schema/**'
              - '.github/workflows/ci.yml'
            selfhost:
              - 'selfhost/**'
              - 'schema/**'
              # Cutting a release is a commit that touches ONLY this file. Without
              # it here that commit triggers no jobs at all, and a malformed or
              # deleted VERSION ships green — past the very tests written to
              # catch it.
              - 'VERSION'
              - '.github/workflows/ci.yml'
            processor:
              - 'processor/**'
              - '.github/workflows/ci.yml'
            accounts:
              - 'accounts-portal/**'
              - '.github/workflows/ci.yml'
            drive:
              - 'drive/**'
              - '.github/workflows/ci.yml'

  # The security-critical core: the per-user worker (263 tests) validates auth,
  # ownership, media stitching, sync and Drive.
  api-shim:
    needs: changes
    if: needs.changes.outputs.shim == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: immich-api-shim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: immich-api-shim/package-lock.json
      - run: npm ci
      - run: npm test

  # The provisioning broker: mints scoped worker sessions, attaches processors,
  # runs auto-updates. Typecheck first, then its unit + SSRF-pin tests.
  deployment-service:
    needs: changes
    if: needs.changes.outputs.deployment == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: deployment-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: deployment-service/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The self-hosting CLI. Untested regressions here strand strangers who have
  # no way to tell our bug apart from their own misconfiguration, and it is what
  # the README now points every new user at.
  #
  # This job used to run `npm test` with no install, and enforce a hard "no
  # dependencies" rule, because the package ran straight from a bare clone.
  # `install.sh` ended that — it runs `npm ci` before any of our code executes,
  # which is what makes the prompt library legal (BUILD_ORDER P5).
  #
  # The rule was replaced, not dropped. `test/dependencies.test.mjs` now holds
  # the same ground in a form that runs locally too: a package budget, exact
  # pins only, no install scripts, and a lockfile that agrees with
  # package.json. It lives in the suite rather than here on purpose — a guard
  # that only exists in CI is a guard nobody runs before pushing.
  #
  # `npm ci` itself is load-bearing: it is the exact command install.sh runs on
  # a stranger's machine, so a lockfile that cannot be installed fails here
  # instead of there.
  selfhost:
    needs: changes
    if: needs.changes.outputs.selfhost == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: selfhost
    strategy:
      fail-fast: false
      matrix:
        # The FLOOR and a current release. Running only the newest is how a
        # dependency requiring Node >= 20.12 sat next to `engines: ">=18"` and
        # `MIN_NODE=18` in install.sh without anything going red: Ubuntu 22.04
        # and Debian 12 users would have installed cleanly and then hit
        # "does not provide an export named 'styleText'" on their first
        # command. 20.12.0 is the oldest Node this package claims to run on, so
        # it is the one worth proving.
        node: ['20.12.0', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: selfhost/package-lock.json
      - run: npm ci
      - run: npm test

  # The owner-pinned image thumbnailer that runs on each user's own Vercel.
  processor:
    needs: changes
    if: needs.changes.outputs.processor == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: processor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: processor/package-lock.json
      - run: npm ci
      - run: npm test

  # The account hub / signup + setup wizard. A build catches broken imports,
  # bad JSX and dead references before they reach Firebase Hosting.
  accounts-portal:
    needs: changes
    if: needs.changes.outputs.accounts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: accounts-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: accounts-portal/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # The Drive app. (No lint gate yet — the committed eslint config currently
  # reports pre-existing violations; a build still catches real breakage.)
  drive:
    needs: changes
    if: needs.changes.outputs.drive == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: drive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: drive/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
