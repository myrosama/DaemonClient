# Enforces the one rule in RELEASING.md that cannot be enforced anywhere else:
# the tracked VERSION file must equal the tag being released.
#
# Why it needs its own workflow rather than a test in ci.yml: between releases
# VERSION legitimately equals the LAST tag, so a check on `main` would either
# pass trivially or fail constantly. The only moment the rule is checkable is
# the moment a tag appears.
#
# What it prevents: VERSION bumped ahead of its tag. Everyone who clones `main`
# in between stamps the unreleased number into their worker, so when the tag is
# finally cut `isNewerVersion('v2.1.0', '2.1.0')` is false and those installs
# are never told to update. They sit on pre-release code, silently, forever.
name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  version-matches-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: VERSION equals the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < VERSION)"
          echo "tag:     $tag"
          echo "VERSION: $file"
          if [ "$tag" != "$file" ]; then
            echo "::error::VERSION is '$file' but the tag is '$GITHUB_REF_NAME'."
            echo "::error::Bump VERSION in the commit you tag — see RELEASING.md."
            exit 1
          fi

      - name: VERSION is a plain three-part semver
        # Same bound the CLI applies (selfhost/src/version.mjs). A version the
        # worker cannot compare sanely — a date, or a number larger than any
        # future release — suppresses the update banner permanently.
        run: |
          file="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$file" | grep -Eq '^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$'; then
            echo "::error::VERSION '$file' is not a three-part semver with components under 1000."
            exit 1
          fi

      - name: the changelog mentions it
        run: |
          tag="${GITHUB_REF_NAME#v}"
          grep -q "$tag" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no entry for $tag."
            exit 1
          }

  # The release feed is what self-hosted installs poll. A tag with no PUBLISHED
  # release leaves that feed unchanged, so every install goes on believing it is
  # current — the failure this whole mechanism exists to prevent, reintroduced
  # by forgetting one command.
  reminder:
    needs: version-matches-tag
    runs-on: ubuntu-latest
    steps:
      - name: publish the release, not just the tag
        run: |
          echo "::notice::Tag ${GITHUB_REF_NAME} checked out clean."
          echo "::notice::Now PUBLISH the release — update-check.ts reads /releases/latest,"
          echo "::notice::which only sees published releases. A tag alone reaches nobody."
